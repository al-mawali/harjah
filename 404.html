<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — هرجة</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;background:#0E5E55;color:#FDF6EE;font-family:"Tajawal","Cairo",Tahoma,sans-serif;font-size:18px;line-height:1.8}
img{width:96px;height:96px;border-radius:24px;margin:0 auto 18px;display:block;box-shadow:0 14px 34px #0007}
h1{font-family:"Cairo",Tahoma,sans-serif;font-weight:800;font-size:clamp(34px,8vw,56px);line-height:1.3}
p{opacity:.85;margin-top:8px}
a{display:inline-block;margin-top:26px;background:#FDF6EE;color:#07403A;text-decoration:none;font-family:"Cairo",Tahoma,sans-serif;font-weight:600;padding:12px 28px;border-radius:16px;box-shadow:0 8px 0 #07403A}
a:focus-visible{outline:3px solid #C58A1B;outline-offset:3px}
</style>
</head>
<body>
<main>
<img src="assets/icon.png" alt="هرجة" width="96" height="96">
<h1>هرجة ضاعت منك</h1>
<p>الصفحة التي تبحث عنها غير موجودة.</p>
<a href="/">العودة للرئيسية</a>
</main>
</body>
</html>
